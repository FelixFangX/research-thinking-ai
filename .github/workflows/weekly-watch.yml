name: Weekly research watch
on:
  schedule: [{ cron: '0 1 * * 1' }] # Mondays 09:00 Asia/Shanghai
  workflow_dispatch: {}
permissions: { contents: read }
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@v4
        with: { path: watch/state, key: 'watch-state-${{ github.run_id }}', restore-keys: 'watch-state-' }
      - name: Run watch (read-only; writes files only)
        # The digest repo is private, so by default the watch uses OpenAlex only.
        # Set the repo variable DIGEST_URL to a public base URL serving <date>.json to include it. No tokens here.
        env: { DIGEST_URL: '${{ vars.DIGEST_URL }}' }
        run: pnpm -s watch ${DIGEST_URL:+--digest-url "$DIGEST_URL"} --json
      - run: cat watch/out/*.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: 'watch-${{ github.run_id }}', path: watch/out }
      - uses: actions/cache/save@v4
        with: { path: watch/state, key: 'watch-state-${{ github.run_id }}' }
