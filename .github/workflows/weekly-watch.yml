name: Weekly research watch
on:
  schedule: [{ cron: '0 1 * * 1' }] # Mondays 09:00 Asia/Shanghai
  workflow_dispatch: {}
permissions: { contents: read }
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@v4
        with: { path: watch/state, key: 'watch-state-${{ github.run_id }}', restore-keys: 'watch-state-' }
      - name: Run watch (read-only; writes files only)
        run: pnpm -s watch --digest-url "https://raw.githubusercontent.com/FelixFangX/tech-news-digest/master/daily" --json
      - run: cat watch/out/*.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: 'watch-${{ github.run_id }}', path: watch/out }
      - uses: actions/cache/save@v4
        with: { path: watch/state, key: 'watch-state-${{ github.run_id }}' }
