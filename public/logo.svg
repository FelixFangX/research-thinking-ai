<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <defs>
    <style>
      .frame { fill: var(--c, #00ff41); }
      .node { fill: var(--c, #00ff41); }
      .link { stroke: var(--c, #00ff41); stroke-width: 1; fill: none; opacity: 0.5; }
      .handle { fill: var(--c, #00ff41); opacity: 0.7; }
      .core { fill: var(--c, #00ff41); opacity: 0.9; }
      .ring { fill: none; stroke: var(--c, #00ff41); stroke-width: 0.5; opacity: 0.2; }
      .pulse { fill: var(--c, #00ff41); opacity: 0.08; }
    </style>
  </defs>
  <!-- Outer pulse rings -->
  <circle class="pulse" cx="28" cy="28" r="28"/>
  <circle class="ring" cx="28" cy="28" r="24"/>
  <circle class="ring" cx="28" cy="28" r="22"/>
  <!-- Magnifying glass lens - pixel art circle -->
  <!-- Top edge -->
  <rect class="frame" x="16" y="6" width="24" height="2"/>
  <!-- Top-left corner -->
  <rect class="frame" x="12" y="8" width="4" height="2"/>
  <rect class="frame" x="10" y="10" width="2" height="2"/>
  <rect class="frame" x="8" y="12" width="2" height="4"/>
  <!-- Top-right corner -->
  <rect class="frame" x="40" y="8" width="4" height="2"/>
  <rect class="frame" x="44" y="10" width="2" height="2"/>
  <rect class="frame" x="46" y="12" width="2" height="4"/>
  <!-- Left edge -->
  <rect class="frame" x="6" y="16" width="2" height="24"/>
  <!-- Right edge -->
  <rect class="frame" x="48" y="16" width="2" height="24"/>
  <!-- Bottom-left corner -->
  <rect class="frame" x="8" y="40" width="2" height="4"/>
  <rect class="frame" x="10" y="44" width="2" height="2"/>
  <rect class="frame" x="12" y="46" width="4" height="2"/>
  <!-- Bottom-right corner -->
  <rect class="frame" x="46" y="40" width="2" height="4"/>
  <rect class="frame" x="44" y="44" width="2" height="2"/>
  <rect class="frame" x="40" y="46" width="4" height="2"/>
  <!-- Bottom edge -->
  <rect class="frame" x="16" y="48" width="24" height="2"/>
  <!-- Handle (diagonal, pixel-stepped) -->
  <rect class="handle" x="44" y="44" width="4" height="4"/>
  <rect class="handle" x="47" y="47" width="4" height="4"/>
  <rect class="handle" x="50" y="50" width="4" height="4"/>
  <rect class="handle" x="53" y="53" width="4" height="4"/>
  <rect class="handle" x="56" y="56" width="4" height="4" rx="1"/>
  <rect class="handle" x="58" y="58" width="4" height="4" rx="1"/>
  <!-- Inner network - Research Knowledge Graph -->
  <!-- Central hub node -->
  <circle class="core" cx="28" cy="28" r="3.5"/>
  <!-- Satellite nodes -->
  <circle class="node" cx="18" cy="18" r="2.5"/>
  <circle class="node" cx="38" cy="16" r="2"/>
  <circle class="node" cx="16" cy="32" r="2"/>
  <circle class="node" cx="38" cy="36" r="2.5"/>
  <circle class="node" cx="22" cy="42" r="2"/>
  <circle class="node" cx="34" cy="22" r="1.8"/>
  <circle class="node" cx="20" cy="26" r="1.5"/>
  <!-- Network edges -->
  <line class="link" x1="18" y1="18" x2="28" y2="28"/>
  <line class="link" x1="38" y1="16" x2="28" y2="28"/>
  <line class="link" x1="16" y1="32" x2="28" y2="28"/>
  <line class="link" x1="38" y1="36" x2="28" y2="28"/>
  <line class="link" x1="22" y1="42" x2="28" y2="28"/>
  <line class="link" x1="34" y1="22" x2="28" y2="28"/>
  <line class="link" x1="20" y1="26" x2="28" y2="28"/>
  <!-- Cross-links between satellites -->
  <line class="link" x1="18" y1="18" x2="38" y2="16"/>
  <line class="link" x1="18" y1="18" x2="20" y2="26"/>
  <line class="link" x1="20" y1="26" x2="16" y2="32"/>
  <line class="link" x1="16" y1="32" x2="22" y2="42"/>
  <line class="link" x1="34" y1="22" x2="38" y2="16"/>
  <line class="link" x1="38" y1="36" x2="22" y2="42"/>
  <line class="link" x1="34" y1="22" x2="38" y2="36"/>
  <!-- Tiny tertiary nodes on edges -->
  <circle class="node" cx="23" cy="23" r="0.8" opacity="0.5"/>
  <circle class="node" cx="33" cy="32" r="0.8" opacity="0.5"/>
  <circle class="node" cx="19" cy="37" r="0.8" opacity="0.5"/>
</svg>
