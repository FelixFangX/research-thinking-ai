<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <defs>
    <style>
      .frame { fill: #00ff41; }
      .node { fill: #00ff41; }
      .link { stroke: #00ff41; stroke-width: 0.8; fill: none; opacity: 0.6; }
      .handle { fill: #00cc33; }
    </style>
  </defs>
  <!-- Magnifying glass lens (pixel ring) -->
  <rect class="frame" x="8" y="4" width="12" height="2"/>
  <rect class="frame" x="6" y="6" width="2" height="2"/>
  <rect class="frame" x="20" y="6" width="2" height="2"/>
  <rect class="frame" x="4" y="8" width="2" height="2"/>
  <rect class="frame" x="22" y="8" width="2" height="2"/>
  <rect class="frame" x="4" y="10" width="2" height="8"/>
  <rect class="frame" x="22" y="10" width="2" height="8"/>
  <rect class="frame" x="4" y="18" width="2" height="2"/>
  <rect class="frame" x="22" y="18" width="2" height="2"/>
  <rect class="frame" x="6" y="20" width="2" height="2"/>
  <rect class="frame" x="20" y="20" width="2" height="2"/>
  <rect class="frame" x="8" y="22" width="12" height="2"/>
  <!-- Handle -->
  <rect class="handle" x="21" y="21" width="3" height="3"/>
  <rect class="handle" x="23" y="23" width="3" height="3"/>
  <rect class="handle" x="25" y="25" width="3" height="3"/>
  <rect class="handle" x="27" y="27" width="3" height="3" rx="1"/>
  <!-- Network nodes inside lens -->
  <circle class="node" cx="10" cy="10" r="1.5"/>
  <circle class="node" cx="18" cy="10" r="1.5"/>
  <circle class="node" cx="14" cy="14" r="2"/>
  <circle class="node" cx="9" cy="17" r="1.5"/>
  <circle class="node" cx="18" cy="18" r="1.5"/>
  <!-- Network edges -->
  <line class="link" x1="10" y1="10" x2="14" y2="14"/>
  <line class="link" x1="18" y1="10" x2="14" y2="14"/>
  <line class="link" x1="9" y1="17" x2="14" y2="14"/>
  <line class="link" x1="18" y1="18" x2="14" y2="14"/>
  <line class="link" x1="10" y1="10" x2="18" y2="10"/>
  <line class="link" x1="9" y1="17" x2="18" y2="18"/>
</svg>
